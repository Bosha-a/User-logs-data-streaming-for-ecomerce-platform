version: '3.8'

x-healthcheck:
  healthcheck:
    &healthcheck-common
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 30s

services:
  broker:
    image: confluentinc/cp-kafka:7.9.1-1-ubi8
    env_file:
      - ./env/kafka.env
    environment:
      KAFKA_NODE_ID: 1
      KAFKA_PROCESS_ROLES: 'broker,controller'
      KAFKA_LISTENERS: 'PLAINTEXT://broker:29092,CONTROLLER://broker:29093'
      KAFKA_ADVERTISED_LISTENERS: 'PLAINTEXT://broker:29092'
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
    ports:
      - "9092:9092"
    networks:
      - lp
    volumes:
      - broker:/var/lib/kafka/data
    healthcheck:
      <<: *healthcheck-common
      test: ['CMD', 'kafka-broker-api-versions', '--bootstrap-server', 'broker:29092']

  producer:
    build:
      context: ./producer
      dockerfile: Dockerfile-Producer
    command: ["python", "producer.py"]
    depends_on:
      - broker
    env_file:
      - ./env/kafka.env
    networks:
      - lp
    restart: always

  spark-master:
    image: apache/spark:3.5.3
    command: /opt/bitnami/spark/sbin/start-master.sh
    ports:
      - "8080:8080"
      - "7077:7077"
    networks:
      - lp
    restart: always

  spark-worker:
    image: apache/spark:3.5.3
    command: /opt/bitnami/spark/sbin/start-worker.sh spark://spark-master:7077
    depends_on:
      - spark-master
    networks:
      - lp
    restart: always

  redis:
    image: redis:7.2.10-bookworm
    ports:
      - "6379:6379"
    networks:
      - lp
    restart: always
    healthcheck:
      <<: *healthcheck-common
      test: ["CMD", "redis-cli", "ping"]

  postgres:
    image: postgres:17.4-bookworm
    env_file:
      - ./env/postgres.env
      - ./env/postgres.creds
    ports:
      - "5432:5432"
    networks:
      - lp
    restart: always
    volumes:
      - postgres:/var/lib/postgresql/data

  minio:
    image: minio/minio:RELEASE.2025-07-18T21-56-31Z
    command: server /data --console-address ":9001"
    env_file:
      - ./env/minio.creds
    ports:
      - "9000:9000"
      - "9001:9001"
    networks:
      - lp
    restart: always
    volumes:
      - minio:/data

  grafana:
    image: grafana/grafana:11.3.0
    depends_on:
      - redis
      - postgres
    environment:
      - GF_SECURITY_ADMIN_PASSWORD=admin
    ports:
      - "3000:3000"
    networks:
      - lp
    restart: always
    volumes:
      - grafana:/var/lib/grafana
      - ./grafana/datasources.yml:/etc/grafana/provisioning/datasources/datasources.yml

networks:
  lp:

volumes:
  broker:
  redis:
  postgres:
  minio:
  grafana: